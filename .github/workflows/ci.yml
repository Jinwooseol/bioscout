name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra demo --extra trace  # the extras, so the page and tracing tests run too
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --extra demo --extra trace pytest -q
      - name: MCP server starts over stdio
        run: uv run python scripts/smoke_live.py --offline

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bioscout-demo .
      - name: The demo page starts in the container, with no API key
        run: |
          docker run -d --name demo -p 7860:7860 bioscout-demo
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:7860/_stcore/health; then
              docker exec demo python -c "from pathlib import Path; from bioscout import demo; assert len(demo.load_recorded(Path('app/examples.json'))) == len(demo.EXAMPLE_QUESTIONS)"
              exit 0
            fi
            sleep 2
          done
          docker logs demo
          exit 1

  # CI cannot run the agent (no API key) or replay it (the response cache holds abstracts, which are
  # not committed). It checks the committed evidence instead: the report named in evals/baseline.json
  # must have been made with the prompts, settings and questions in this commit, hold no fabricated
  # PMID, and not have dropped beyond the limits since the baseline before this change.
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the gate reads the baseline of an earlier commit
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: The eval report behind this commit matches the code and has not regressed
        run: uv run bioscout-eval gate --since "${{ github.event.pull_request.base.sha || github.event.before }}"
