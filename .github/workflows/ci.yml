name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The extras, so the page, tracing and API tests run too.
      - run: uv sync --locked --extra demo --extra trace --extra api
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --extra demo --extra trace --extra api pytest -q
      - name: MCP server starts over stdio
        run: uv run python scripts/smoke_live.py --offline

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bioscout-demo .
      - name: The demo page starts in the container, with no API key
        run: |
          docker run -d --name demo -p 7860:7860 bioscout-demo
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:7860/_stcore/health; then
              docker exec demo python -c "from pathlib import Path; from bioscout import demo; assert len(demo.load_recorded(Path('app/examples.json'))) == len(demo.EXAMPLE_QUESTIONS)"
              exit 0
            fi
            sleep 2
          done
          docker logs demo
          exit 1
      - name: The API starts in the same image, serves the recorded answers and refuses new questions without a key
        run: |
          docker run -d --name api -p 7861:7860 bioscout-demo bioscout-api
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:7861/health; then
              test "$(curl -fs http://localhost:7861/v1/examples | python3 -c 'import json, sys; print(len(json.load(sys.stdin)))')" = 3
              test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:7861/v1/answers -H 'Content-Type: application/json' -d '{"question": "Does drug X lower mortality?"}')" = 503
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1
      # What a host does: it cannot always change the command, and the volume it mounts is root's.
      - name: Told by a variable to serve the API, it runs as uid 1000 and keeps the count in a mounted folder that root owns
        run: |
          sudo mkdir -p /tmp/bioscout-data
          sudo chown root:root /tmp/bioscout-data
          sudo chmod 755 /tmp/bioscout-data
          docker run -d --name hosted -p 7862:7860 -e BIOSCOUT_SERVE=api -e BIOSCOUT_CACHE_DIR=/data -v /tmp/bioscout-data:/data bioscout-demo
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:7862/health; then
              curl -fs http://localhost:7862/v1/status | python3 -c 'import json, sys; status = json.load(sys.stdin); assert not status["live"] and status["quota"]["left_today"] == 20, status'
              test "$(docker exec hosted sh -c "grep '^Uid:' /proc/1/status | cut -f2")" = 1000
              test "$(stat -c %u /tmp/bioscout-data/quota.sqlite)" = 1000
              exit 0
            fi
            sleep 2
          done
          docker logs hosted
          exit 1

  # CI cannot run the agent (no API key) or replay it (the response cache holds abstracts, which are
  # not committed). It checks the committed evidence instead: the report named in evals/baseline.json
  # must have been made with the prompts, settings and questions in this commit, hold no fabricated
  # PMID, and not have dropped beyond the limits since the baseline before this change.
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the gate reads the baseline of an earlier commit
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: The eval report behind this commit matches the code and has not regressed
        run: uv run bioscout-eval gate --since "${{ github.event.pull_request.base.sha || github.event.before }}"
