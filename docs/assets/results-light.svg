<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 318" width="860" height="318" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">BioScout evaluation results by variant</title>
<desc id="desc">Share of answer sentences backed by the abstracts they cite, and cost per question, by variant. A. LLM only: 6.3% backed, $0.016; B. Naive RAG: 81.5% backed, $0.024; C. Agent: 93.4% backed, $0.148; E. Agent, embedding rank: 91.7% backed, $0.055.</desc>
