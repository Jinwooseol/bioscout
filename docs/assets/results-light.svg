<text x="672" y="42" font-size="14" fill="#0b0b0b" font-weight="600">Cost per question</text>
<text x="28" y="66" font-size="12" fill="#52514e"><tspan font-size="14" fill="#2a78d6">■</tspan><tspan dx="6">Backed by the abstracts it cites</tspan><tspan dx="20" font-size="14" fill="#eb6834">■</tspan><tspan dx="6">Cited, not fully backed</tspan><tspan dx="20" font-size="14" fill="#898781" fill-opacity="0.45">■</tspan><tspan dx="6">No citation</tspan></text>
