        "기록 파일에는 답변과 논문의 서지 정보만 넣는다. 초록과, judge가 초록에서 옮긴 근거 구절은 뺐다. 논문 본문과 초록은 커밋하지 않는다는 규칙 때문이다. 그래서 기록된 답변에는 근거 구절 줄이 없다. 기록 파일에 초록이 없는지는 테스트가 확인한다.",
        "응답 캐시를 통째로 싣는 방법은 버렸다. 캐시에는 PubMed 응답, 곧 초록이 들어 있다.",
        "컨테이너는 uid 1000 사용자로 7860 포트에서 실행한다. Hugging Face Docker Space의 조건이다. API 키는 실행할 때 환경 변수로 주고, .dockerignore가 .env를 빌드에서 뺀다.",
        "CI에 image 작업을 더했다. 이미지를 빌드하고, 키 없이 컨테이너를 띄워 화면이 뜨는지와 기록된 예시가 읽히는지 확인한다.",
      ],
      blocked: [
        "이 PC에는 Docker, Podman, WSL이 없어 이미지를 빌드해 보지 못했다. 설치 단계(의존성만, 그다음 프로젝트)는 빈 폴더에서 같은 명령으로 미리 돌려 확인했다. 이미지 빌드 자체는 CI가 처음 확인한다.",
        "공개 배포 전에 전체 질문 수 한도가 필요하다. 지금 한도는 브라우저 세션 단위라 새로 고치면 다시 5개가 된다.",
      ],
      numbers: [
        "기록된 예시 3개: 문장 5개, 6개, 6개 모두 지지. 처음 만들 때의 비용 $0.25, $0.23, $0.18. 기록하는 데 든 새 비용 없음",
        "단위 테스트 84 → 87개 (demo 없이 실행하면 85개 통과, 2개 건너뜀)",
        "CI의 image 작업 통과: 이미지 첫 빌드가 성공했고, 컨테이너에서 화면이 뜨고 기록된 예시 3개가 읽힘",
      ],
    },
    { phase: 6, title: "공개 배포",
      decided: [
        "공개 주소에는 정적 페이지 한 장을 올렸다. Streamlit 화면과 같은 기록 파일(app/examples.json)을 읽어 답변, 판정, 출처, 비용을 그린다. 모델을 부르지 않으므로 비용이 들지 않는다.",
        "올릴 파일은 배포 스크립트가 목록으로 골라 임시 폴더에 모은다. 저장소 전체를 올리지 않으므로 .env, 캐시, 평가 기록이 섞일 수 없다. 토큰은 저장소에 두지 않고 PC에 저장된 로그인을 쓴다.",
        "Streamlit 화면은 API 키가 없으면 실시간 질문이 꺼져 있다고 알리고, 남은 질문 수 표시를 숨기고, 소스 저장소 링크를 보여 준다.",
        "Docker Space 배포도 같은 스크립트에 남겼다(--sdk docker).",
      ],
      blocked: [
        "Hugging Face가 Docker Space 호스팅에 유료 플랜(PRO)을 요구한다. 생성 요청이 402로 거절됐다. 그래서 Streamlit 화면 자체는 공개 주소에 올리지 못했다.",
        "공개 주소에서 직접 질문을 받으려면 전체 질문 수 한도가 먼저 필요하다. 아직 만들지 않았다.",
      ],
      numbers: [
        "공개 주소: https://brakey-bioscout.static.hf.space (예시 답변 3개). 페이지와 examples.json 응답 확인",
        "단위 테스트 87 → 92개",
      ],
    },
  ],
};

const LABEL = { done: "완료", doing: "진행 중", todo: "예정", cut: "제외" };
const ROWS = "ABCDEFGHIJKL";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wellClass = (s) => "well " + (s === "done" ? "done" : s === "doing" ? "doing" : s === "cut" ? "cut" : "");

const all = PROGRESS.phases.flatMap((p) => p.tasks);
const count = (s) => all.filter((t) => t.s === s).length;
const open = (p) => p.tasks.filter((t) => t.s !== "done" && t.s !== "cut").length;
// The phase being worked on: the latest one with a task in progress, else the first with open tasks.
const current = [...PROGRESS.phases].reverse().find((p) => p.tasks.some((t) => t.s === "doing"))
  ?? PROGRESS.phases.find((p) => open(p) > 0);

$("summary").textContent =
  `작업 ${all.length}개 중 ${count("done")}개 완료, ${count("doing")}개 진행 중. ` +
  (current ? `지금 단계는 "${current.title}"이고, 이 단계에 남은 작업은 ${open(current)}개입니다.` : "모든 작업을 마쳤습니다.");

/* Plate */
const maxRows = Math.max(...PROGRESS.phases.map((p) => p.tasks.length));
let plate = `<span></span>` + PROGRESS.phases.map((p) =>
  `<span class="lab${p === current ? " current" : ""}">${p.phase}</span>`).join("");
for (let r = 0; r < maxRows; r++) {
  plate += `<span class="lab">${ROWS.charAt(r)}</span>`;
  for (const p of PROGRESS.phases) {
    const t = p.tasks.at(r);
    plate += t
      ? `<a href="#t-${p.phase}-${r}" title="${esc(p.title)} ${ROWS.charAt(r)}: ${esc(t.t)} (${LABEL[t.s]})" aria-label="${esc(p.title)} ${ROWS.charAt(r)}: ${esc(t.t)}, ${LABEL[t.s]}"><i class="${wellClass(t.s)}"></i></a>`
      : `<span class="empty" aria-hidden="true"></span>`;
  }
}
$("plate").innerHTML = plate;
$("tally").innerHTML = ["done", "doing", "todo", "cut"]
  .map((s) => `<span><i class="${wellClass(s)}"></i>${LABEL[s]} <b>${count(s)}</b></span>`).join("");

/* Metrics */
const cell = (x) => (x === undefined || x === null ? "—" : esc(x));
$("metrics").innerHTML = PROGRESS.metrics.map((m) =>
  `<tr><td>${esc(m.v)}</td><td class="num">${cell(m.fake)}</td><td class="num">${cell(m.precision)}</td><td class="num">${cell(m.coverage)}</td><td class="num">${cell(m.accuracy)}</td><td class="num">${cell(m.cost)}</td></tr>`).join("");
$("metrics-note").textContent = PROGRESS.metricsNote;

/* Phases */
$("days").innerHTML = PROGRESS.phases.map((p) => `
  <section class="day" id="phase-${p.phase}">
    <h3>${p.phase}. ${esc(p.title)}</h3>
    <ul>${p.tasks.map((t, i) => `
      <li id="t-${p.phase}-${i}"><i class="${wellClass(t.s)}" role="img" aria-label="${LABEL[t.s]}"></i>
        <div>${ROWS.charAt(i)}. ${esc(t.t)}${t.why ? `<span class="why">${esc(t.why)}</span>` : ""}</div></li>`).join("")}
    </ul>
  </section>`).join("");

/* Log, newest first */
const list = (xs) => `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
const phaseTitle = (n) => PROGRESS.phases.find((p) => p.phase === n)?.title ?? "";
$("log").innerHTML = [...PROGRESS.log].reverse().map((e) => `
  <article>
    <h3>${esc(e.title)} <span class="small">${esc(phaseTitle(e.phase))}</span></h3>
    <dl>
      ${e.decided?.length ? `<dt>결정</dt><dd>${list(e.decided)}</dd>` : ""}
      ${e.blocked?.length ? `<dt>막힌 점</dt><dd>${list(e.blocked)}</dd>` : ""}
      ${e.numbers?.length ? `<dt>숫자</dt><dd>${list(e.numbers)}</dd>` : ""}
    </dl>
  </article>`).join("");
</script>
</body>
</html>
